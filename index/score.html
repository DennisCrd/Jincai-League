<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分榜 | Jincai League</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#ffffff;
            color:#111;
            font-family:'Times New Roman','Noto Serif SC',serif;
            padding:36px 18px;
            max-width:820px;
            margin:0 auto;
            line-height:1.65;
        }
        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#111;
            text-decoration:none;
            border-bottom:1px solid #999;
        }
        .back:hover{
            border-bottom-color:#111;
        }
        .title-wrap{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            margin-bottom:28px;
        }
        .title-logo{
            width:28px;
            height:auto;
        }
        h1{
            margin:0;
            font-size:28px;
            font-weight:bold;
            color:#111;
        }
        .rank-card{
            border:1px solid #ddd;
        }
        .rank-header{
            display:grid;
            grid-template-columns:60px 1fr 140px 120px;
            padding:14px 20px;
            background:#333333;
            color:#fff;
            font-weight:bold;
        }
        .rank-item{
            display:grid;
            grid-template-columns:60px 1fr 140px 120px;
            padding:16px 20px;
            border-bottom:1px solid #ddd;
            align-items:center;
        }
        .rank-num{font-weight:bold;font-size:18px;}
        .rank-name{font-size:17px;color:#111;}
        .rank-record{text-align:center;font-size:16px;color:#111;}
        .rank-score{text-align:center;font-weight:bold;color:#111;font-size:17px;}
        .rank-header div{text-align:center;}
        .rank-header div:nth-child(2){text-align:left;}
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <div class="title-wrap">
        <img src="images/logo.png" alt="logo" class="title-logo">
        <h1>联赛积分榜</h1>
    </div>
    <div class="rank-card">
        <div class="rank-header">
            <div>名次</div>
            <div>球队</div>
            <div>胜‑平‑负</div>
            <div>积分</div>
        </div>
        <div id="scoreWrap"></div>
    </div>
<script>
// 只填 name / win胜 / draw平 / lose负，不再写point
const scoreData = [
    {name:"7尔西", win:2, lose:0, draw:0},
    {name:"上海曼巴", win:1, lose:0, draw:1},
    {name:"五花果福瑞", win:0, lose:2, draw:0},
    {name:"上海花生", win:0, lose:1, draw:1},
];

// 自动计算积分：胜3，平1，负0
const calcList = scoreData.map(item=>{
    const point = item.win * 3 + item.draw * 1;
    return {...item, point};
});

// 根据自动算出来的积分从高到低排序
const sortedScore = calcList.sort((a,b)=>b.point - a.point);

const wrap = document.getElementById("scoreWrap");
sortedScore.forEach((item, index)=>{
    const rank = index + 1;
    const div = document.createElement("div");
    div.className = "rank-item";
    div.innerHTML = `
        <div class="rank-num">${rank}</div>
        <div class="rank-name">${item.name}</div>
        <div class="rank-record">${item.win}‑${item.draw}‑${item.lose}</div>
        <div class="rank-score">${item.point}</div>
    `;
    wrap.appendChild(div);
})
</script>
</body>
</html>
