<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛程 | Jincai League</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#ffffff;
            color:#111;
            font-family:'Times New Roman','Noto Serif SC',serif;
            padding:36px 18px;
            max-width:820px;
            margin:0 auto;
            line-height:1.65;
        }
        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#111;
            text-decoration:none;
            border-bottom:1px solid #999;
        }
        .back:hover{
            border-bottom-color:#111;
        }
        .title-wrap{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            margin-bottom:28px;
        }
        .title-logo{
            width:28px;
            height:auto;
        }
        h1{
            margin:0;
            font-size:28px;
            font-weight:bold;
            color:#111;
        }
        .rank-card{
            border:1px solid #ddd;
        }
        .rank-header{
            display:grid;
            grid-template-columns:1fr 140px 1fr;
            padding:14px 20px;
            background:#333333;
            color:#fff;
            font-weight:bold;
        }
        .rank-item{
            display:grid;
            grid-template-columns:1fr 140px 1fr;
            padding:18px 20px;
            border-bottom:1px solid #ddd;
            align-items:center;
        }
        .home-team{
            text-align:right;
            font-size:17px;
        }
        .vs-block{
            text-align:center;
        }
        .vs-text{
            font-weight:bold;
            font-size:18px;
        }
        .time-text{
            font-size:14px;
            color:#555;
            margin-top:4px;
        }
        .away-team{
            text-align:left;
            font-size:17px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <div class="title-wrap">
        <img src="images/logo.png" alt="logo" class="title-logo">
        <h1>联赛赛程</h1>
    </div>
    <div class="rank-card">
        <div class="rank-header">
            <div style="text-align:right;">主队</div>
            <div style="text-align:center;">信息</div>
            <div style="text-align:left;">客队</div>
        </div>
        <div id="scheduleWrap"></div>
    </div>
<script>
// score:填比分代表已结束；score:null代表未进行，显示VS
const scheduleData = [
    {home:"7尔西", away:"上海花生", time:"09‑15 周二 17:20", score:"3 : 0"},
    {home:"上海曼巴", away:"五花果福瑞", time:"09‑17 周四 17:20", score:"2 : 1"},
    {home:"上海花生", away:"上海曼巴", time:"09‑20 周日 17:20", score:"0 : 0"},
    {home:"7尔西", away:"五花果福瑞", time:"09‑21 周一 17:20", score:"5 : 0"},
    {home:"7尔西", away:"上海曼巴", time:"09‑22 周二 17:20", score:null},
    {home:"上海花生", away:"五花果福瑞", time:"09‑23 周三 17:20", score:null},
    {home:"上海花生", away:"上海曼巴", time:"09‑28 周一 17:20", score:null},
    {home:"7尔西", away:"五花果福瑞", time:"09‑29 周二 17:20", score:null},
    {home:"上海曼巴", away:"五花果福瑞", time:"09‑30 周三 17:20", score:null},
    {home:"7尔西", away:"上海花生", time:"10‑12 周一 17:20", score:null},
    {home:"上海花生", away:"五花果福瑞", time:"10‑13 周二 17:20", score:null},
    {home:"7尔西", away:"上海曼巴", time:"10‑15 周四 17:20", score:null},
    {home:"7尔西", away:"五花果福瑞", time:"10‑19 周一 17:20", score:null},
    {home:"上海花生", away:"上海曼巴", time:"10‑20 周二 17:20", score:null},
    {home:"7尔西", away:"上海曼巴", time:"10‑21 周三 17:20", score:null},
    {home:"上海花生", away:"五花果福瑞", time:"10‑22 周四 17:20", score:null},
    {home:"上海曼巴", away:"五花果福瑞", time:"10‑28 周一 17:20", score:null},
    {home:"7尔西", away:"上海花生", time:"10‑29 周二 17:20", score:null},
];

const wrap = document.getElementById("scheduleWrap");
scheduleData.forEach(game=>{
    const div = document.createElement("div");
    div.className = "rank-item";
    const centerText = game.score ? game.score : "VS";
    div.innerHTML = `
        <div class="home-team">${game.home}</div>
        <div class="vs-block">
            <div class="vs-text">${centerText}</div>
            <div class="time-text">${game.time}</div>
        </div>
        <div class="away-team">${game.away}</div>
    `;
    wrap.appendChild(div);
})
</script>
</body>
</html>
